# Builds the Windows installer from what tools/package/stage.mjs assembled. Run "yarn dist" from the repository root.
appId: app.theama.desktop
productName: Theama
copyright: Theama
electronVersion: 44.9.0
# Use the Electron already installed for development instead of downloading it again.
electronDist: ../../node_modules/electron/dist
# Keep only the Chromium language packs for the interface languages (apps/ui/src/i18n/locales); drops ~45 MB.
electronLanguages: [en-US, el]

directories:
  app: ../../build/stage/app
  output: ../../build/installer
  buildResources: build

asar: true
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

# Placed next to the app as "resources/": the interface, the backend, Node.js, NSSM, FFprobe, notices.
extraResources:
  - from: ../../build/stage/resources
    to: .

win:
  icon: ../../build/stage/app/icon.ico
  target:
    - target: nsis
      arch: [x64]
  # Signed only when CSC_LINK (+ CSC_KEY_PASSWORD) are set in the environment; "yarn dist:signed" checks them first and
  # "yarn verify:signature" checks the result. Without them the installer is unsigned and SmartScreen warns (docs/11-risks.md).
  signAndEditExecutable: true
  signtoolOptions:
    signingHashAlgorithms: [sha256]
    rfc3161TimeStampServer: http://timestamp.digicert.com

nsis:
  oneClick: false
  perMachine: true
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Theama
  deleteAppDataOnUninstall: false
  include: build/installer.nsh
  artifactName: Theama-Setup-${version}.${ext}
