<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Theama">
  <defs>
    <linearGradient id="bronze" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E3C58A"/>
      <stop offset="0.55" stop-color="#B8925A"/>
      <stop offset="1" stop-color="#8A6A3C"/>
    </linearGradient>
  </defs>
  <!-- outer frame ring with two classical tick marks -->
  <circle cx="256" cy="256" r="212" fill="none" stroke="url(#bronze)" stroke-width="6"/>
  <rect x="30" y="252" width="30" height="8" fill="url(#bronze)"/>
  <rect x="452" y="252" width="30" height="8" fill="url(#bronze)"/>
  <!-- theta: ring + crossbar, the crossbar doubles as a film-gate slit -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#bronze)" stroke-width="32"/>
  <rect x="150" y="241" width="212" height="30" fill="url(#bronze)"/>
  <!-- lens glint -->
  <circle cx="256" cy="256" r="9" fill="#12100E"/>
</svg>
